<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Star Coin Wallet</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;600&display=swap">
</head>
<body>
  <div class="header">
    <h1>Star Coin Wallet</h1>
    <p>💫 Gestiona tus monedas de forma segura y eficiente 💫</p>
  </div>

  <div class="container">
    <!-- Consultar Balance -->
    <div class="card">
      <h2>🔍 Consultar Balance</h2>
      <label for="username">Ingresa tu nombre:</label>
      <input type="text" id="username" placeholder="Ejemplo: Marlon">
      <label for="password">Ingresa tu contraseña:</label>
      <input type="password" id="password" placeholder="Tu contraseña">
      <button class="btn" onclick="showBalance()">Mostrar Balance</button>
      <p id="balance-display">Tu balance: <span id="balance">---</span> STAR</p>
    </div>

    <!-- Registrar Transacción -->
    <div class="card">
      <h2>💸 Registrar Transacción</h2>
      <label for="sender">Remitente:</label>
      <input type="text" id="sender" placeholder="Tu nombre">
      <label for="sender-password">Contraseña del remitente:</label>
      <input type="password" id="sender-password" placeholder="Tu contraseña">
      <label for="receiver">Destinatario:</label>
      <input type="text" id="receiver" placeholder="Nombre del amigo">
      <label for="amount">Cantidad:</label>
      <input type="number" id="amount" placeholder="Ejemplo: 50">
      <button class="btn btn-alt" onclick="registerTransaction()">Registrar Transacción</button>
    </div>
  </div>

  <footer>
    <p>🌟 Powered offline ✨</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
